<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6ff"/>
      <stop offset="1" stop-color="#dbf6ec"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fc6d6"/>
      <stop offset="1" stop-color="#2f9fce"/>
    </linearGradient>
    <clipPath id="round"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <!-- sea -->
    <rect y="45" width="64" height="19" fill="url(#sea)"/>
    <path d="M0 45 q8 3 16 0 t16 0 t16 0 t16 0 v4 H0 Z" fill="#eafcff" opacity=".55"/>
    <!-- island -->
    <ellipse cx="32" cy="48" rx="21" ry="7" fill="#efce8a"/>
    <path d="M13 47 Q32 27 51 47 Z" fill="#4f9e57"/>
    <path d="M17 47 Q32 31 47 47 Z" fill="#6bc46a"/>
    <!-- tree -->
    <rect x="30.4" y="30" width="3.2" height="13" rx="1.5" fill="#7b5330"/>
    <circle cx="32" cy="27" r="8.5" fill="#4fae57"/>
    <circle cx="26" cy="30" r="6" fill="#66c76c"/>
    <circle cx="38" cy="30" r="6" fill="#66c76c"/>
    <circle cx="32" cy="24" r="6.5" fill="#7ed37c"/>
    <!-- magical star + sparkles -->
    <path d="M49 11 l1.7 3.6 4 .5-2.9 2.7.8 3.9-3.6-1.9-3.6 1.9.8-3.9-2.9-2.7 4-.5z" fill="#ffe45e" stroke="#f2c33c" stroke-width=".6"/>
    <circle cx="13" cy="16" r="1.6" fill="#ffffff"/>
    <circle cx="20" cy="10" r="1.1" fill="#fff2b0"/>
  </g>
</svg>
